name: Update README stats card

on:
  schedule:
    - cron: "0 4 * * *"
      timezone: "Etc/GMT-8"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{github.repository_owner}}&number_format=long&include_all_commits=true&show_icons=true&border_radius=0&theme_light=light_github&theme_dark=dark_github
          path: profile/stats.svg
          token: ${{secrets.GITHUB_TOKEN}}

      - name: Commit stats card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README stats card ($(TZ='Etc/GMT-8' date +'%Y-%m-%d'))" || exit 0
          git push
